<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Verify fixture</title><link rel="icon" href="data:,"></head>
<body>
  <h1 id="title">Verify fixture app</h1>
  <p id="status">Signed out</p>
  <a id="login-link" href="login.html">Log in</a>
  <script>
    if (sessionStorage.getItem('verify-signed-in') === '1') {
      const user = sessionStorage.getItem('verify-signed-in-user');
      document.getElementById('status').textContent = user ? 'Signed in as ' + user : 'Signed in';
    }
  </script>
</body>
</html>
